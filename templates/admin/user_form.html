{% extends "base.html" %}
{% block title %}{{ 'Editar' if user else 'Novo' }} usuario - Admin{% endblock %}
{% block main_attributes %} class="container py-4 py-md-5"{% endblock %}
{% block content %}<section class="auth-layout"><div class="text-center mb-4"><p class="eyebrow">Administracao</p><h1 class="hero-title hero-title--compact">{{ 'Editar' if user else 'Novo' }} usuario</h1></div><form method="post" class="card auth-card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="username">Usuario</label><input class="form-control form-control-lg mb-3" id="username" name="username" required value="{{ user.username if user else '' }}"><label class="form-label" for="password">{{ 'Nova senha (opcional)' if user else 'Senha' }}</label><input class="form-control form-control-lg mb-3" id="password" name="password" type="password" {% if not user %}required{% endif %}><div class="form-check mb-4"><input class="form-check-input" type="checkbox" name="is_admin" id="is_admin" {% if user and user.is_admin %}checked{% endif %}><label class="form-check-label" for="is_admin">Administrador</label></div><button class="btn btn-primary w-100">Salvar usuario</button></div></form></section>{% endblock %}
