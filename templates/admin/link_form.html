{% extends "base.html" %}
{% block title %}{{ 'Editar' if link else 'Novo' }} link - Admin{% endblock %}
{% block main_attributes %} class="container py-4 py-md-5"{% endblock %}
{% block content %}<section class="auth-layout"><div class="text-center mb-4"><p class="eyebrow">Administracao</p><h1 class="hero-title hero-title--compact">{{ 'Editar' if link else 'Novo' }} link</h1></div><form method="post" class="card auth-card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="original_url">URL original</label><input class="form-control form-control-lg mb-3" id="original_url" name="original_url" required value="{{ link.original_url if link else '' }}"><label class="form-label" for="short_code">Codigo curto</label><input class="form-control form-control-lg mb-3" id="short_code" name="short_code" value="{{ link.short_code if link else '' }}"><label class="form-label" for="user_id">Dono</label><select class="form-select mb-4" id="user_id" name="user_id"><option value="">Anonimo</option>{% for user in users %}<option value="{{ user.id }}" {% if link and link.user_id == user.id %}selected{% endif %}>{{ user.username }}</option>{% endfor %}</select><button class="btn btn-primary w-100">Salvar link</button></div></form></section>{% endblock %}
