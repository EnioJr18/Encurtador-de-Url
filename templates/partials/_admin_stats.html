<section class="stats-summary row g-3 mb-4" aria-label="Metricas administrativas">
    <div class="col-6 col-lg-3"><article class="stats-card h-100"><span class="stats-card__label"><i class="bx bx-user" aria-hidden="true"></i> Usuarios</span><strong class="stats-card__value">{{ stats.total_users }}</strong><span class="stats-card__detail">Contas cadastradas</span></article></div>
    <div class="col-6 col-lg-3"><article class="stats-card h-100"><span class="stats-card__label"><i class="bx bx-link-alt" aria-hidden="true"></i> Links</span><strong class="stats-card__value">{{ stats.total_links }}</strong><span class="stats-card__detail">Links criados</span></article></div>
    <div class="col-6 col-lg-3"><article class="stats-card h-100"><span class="stats-card__label"><i class="bx bx-bar-chart-alt-2" aria-hidden="true"></i> Acessos</span><strong class="stats-card__value">{{ stats.total_clicks }}</strong><span class="stats-card__detail">Cliques registrados</span></article></div>
    <div class="col-6 col-lg-3"><article class="stats-card h-100"><span class="stats-card__label"><i class="bx bx-time-five" aria-hidden="true"></i> Sem acessos</span><strong class="stats-card__value">{{ stats.links_without_clicks }}</strong><span class="stats-card__detail">Links sem visitas</span></article></div>
</section>
