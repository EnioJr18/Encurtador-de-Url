{% if pagination.pages > 1 %}
<nav class="admin-pagination" aria-label="Paginacao administrativa">
    <ul class="pagination justify-content-center mb-0">
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link" href="{% if pagination.has_prev %}{{ url_for(request.endpoint, page=pagination.prev_num, **pagination_args) }}{% else %}#{% endif %}" aria-label="Pagina anterior">Anterior</a>
        </li>
        {% for page_num in pagination.iter_pages(left_edge=1, left_current=1, right_current=2, right_edge=1) %}
            {% if page_num %}
            <li class="page-item {% if page_num == pagination.page %}active{% endif %}">
                <a class="page-link" href="{{ url_for(request.endpoint, page=page_num, **pagination_args) }}">{{ page_num }}</a>
            </li>
            {% else %}
            <li class="page-item disabled"><span class="page-link">...</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link" href="{% if pagination.has_next %}{{ url_for(request.endpoint, page=pagination.next_num, **pagination_args) }}{% else %}#{% endif %}" aria-label="Proxima pagina">Proxima</a>
        </li>
    </ul>
</nav>
{% endif %}
