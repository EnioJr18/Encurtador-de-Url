<article class="url-card card border-0 shadow-sm h-100">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
            <span class="badge text-bg-primary">{{ url_entry.click_count }} acesso{% if url_entry.click_count != 1 %}s{% endif %}</span>
            <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('urls.serve_qrcode', short_code=url_entry.short_code) }}" target="_blank" rel="noopener">QR Code</a>
        </div>
        <p class="text-muted small mb-1">Link curto</p>
        <a class="url-card__short-link" href="{{ request.host_url }}{{ url_entry.short_code }}" target="_blank" rel="noopener">{{ request.host_url }}{{ url_entry.short_code }}</a>
        <p class="text-muted small mb-1 mt-4">Destino</p>
        <a class="url-card__original-link" href="{{ url_entry.original_url }}" target="_blank" rel="noopener" title="{{ url_entry.original_url }}">{{ url_entry.original_url }}</a>
    </div>
</article>
