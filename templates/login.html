{% extends "base.html" %}

{% block title %}Login - EncurtaJr{% endblock %}

{% block content %}
    <h1 class="hero-title">Fazer Login</h1>

    <form method="POST" action="{{ url_for('auth.login') }}">
        {{ form.hidden_tag() }}

        <label for="username">Usuário</label>
        <input type="text" name="username" id="username" placeholder="Escolha um nome de usuário" required>

        <label for="password">Senha</label>
        <input type="password" name="password" id="password" placeholder="Sua senha secreta" required style="width: 100%; padding: 12px 15px; margin-bottom: 20px; border: 2px solid #e0e0e0; border-radius: 10px; background-color: #f9f9f9; outline: none;">

        <button type="submit">Entrar</button>

        <div class="ver-urls-container" style="margin-top: 20px;">
            <p>Não tem uma conta? Cadastre-se</p>
            <a href="{{ url_for('auth.register') }}" class="ver-urls">Criar Conta</a>
        </div>
    </form>
{% endblock %}
